# Lint configuration (CI runs `ruff check .`). Python 3.9 compatible.
target-version = "py39"
line-length = 120

[lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
# E501: long table/report lines are intentional; UP006/7/35/45: keep typing.Optional style for 3.9 readers;
# SIM108: explicit if/else reads better in risk code.
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "SIM108"]
